# Configuration for Automated Integration Tests & E2E Suites using H2 In-Memory (MySQL Mode)
spring.application.name=popworld-test

# DataSource H2 in MySQL Compatibility Mode
spring.datasource.url=jdbc:h2:mem:popworld_test;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# HikariCP Tuning for Tests
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=5000

# JPA & Hibernate DDL
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.default_batch_fetch_size=30

# Thymeleaf
spring.thymeleaf.cache=false

# SePay Webhook Test Secrets
sepay.webhook.api-key=test_sepay_key
sepay.webhook.secret-key=test_sepay_key
sepay.bank-code=MBBank
sepay.account-number=0355416208
sepay.account-name=POPWORLD TEST STORE

# App Demo Data
app.init-demo-data=false

# Cloudinary Mock Config
cloudinary.cloud-name=test-cloud
cloudinary.api-key=test-api-key
cloudinary.api-secret=test-api-secret
cloudinary.folder=popworld/test
