<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>500 - Lỗi Hệ Thống | PopWorld Art Toy</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/popmart-theme.css(v='2.0')}">
</head>
<body style="background-color: #F8F9FA; min-height: 100vh; display: flex; flex-direction: column;">

    <!-- Header Fragment -->
    <header th:replace="~{fragments/header :: header}"></header>

    <!-- 500 Main Container -->
    <main class="container my-auto py-5 text-center flex-grow-1 d-flex align-items-center justify-content-center">
        <div class="py-4" style="max-width: 620px;">
            <!-- Maintenance / Server error visual -->
            <div class="mb-4 position-relative d-inline-block">
                <div class="bg-black text-warning rounded-4 p-4 shadow-lg d-inline-flex align-items-center justify-content-center" 
                     style="width: 130px; height: 130px; border: 3px solid #F59E0B;">
                    <i class="bi bi-gear-wide-connected fs-1 text-warning"></i>
                </div>
                <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-warning text-dark border border-light px-3 py-2 fw-black" style="font-size: 0.9rem;">
                    SERVER BUSY
                </span>
            </div>

            <h1 class="display-3 fw-black text-uppercase text-dark mb-2" style="letter-spacing: 2px;">
                500 SYSTEM ERROR
            </h1>
            <h4 class="fw-bold text-warning text-uppercase mb-3" style="letter-spacing: 1px;">
                Hệ Thống Đang Xử Lý Hoặc Gián Đoạn Kỹ Thuật
            </h4>
            <p class="text-secondary mb-4 mx-auto" style="max-width: 480px; font-size: 0.95rem; line-height: 1.6;">
                Đã xảy ra sự cố không mong muốn trong khi xử lý yêu cầu của bạn. 
                Đội ngũ kỹ thuật PopWorld đang kiểm tra và khắc phục. Xin vui lòng tải lại trang hoặc quay lại sau ít phút!
            </p>

            <!-- Action buttons -->
            <div class="d-flex flex-wrap justify-content-center gap-3">
                <a href="javascript:location.reload()" class="btn btn-warning fw-bold px-4 py-2 rounded-pill shadow-sm text-dark text-uppercase">
                    <i class="bi bi-arrow-clockwise me-2"></i>Thử Tải Lại Trang
                </a>
                <a th:href="@{/}" class="btn btn-dark fw-bold px-4 py-2 rounded-pill shadow-sm text-uppercase">
                    <i class="bi bi-house-door-fill me-2"></i>Về Trang Chủ
                </a>
                <button type="button" class="btn btn-outline-danger fw-bold px-4 py-2 rounded-pill text-uppercase"
                        data-bs-toggle="modal" data-bs-target="#customerSupportModal">
                    <i class="bi bi-headset me-2"></i>Báo Lỗi Kỹ Thuật
                </button>
            </div>
        </div>
    </main>

    <!-- Footer Fragment -->
    <footer th:replace="~{fragments/footer :: footer}"></footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
