<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="admin-head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title != null ? title + ' - PopWorld Admin' : 'PopWorld Admin Portal'}">PopWorld Admin Portal</title>
    
    <!-- Bootstrap 5.3 CDN & Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    
    <!-- Custom POP MART Admin Theme CSS -->
    <link rel="stylesheet" th:href="@{/css/admin-theme.css(v='1.0')}">
</head>
<body class="admin-body">

<div class="admin-wrapper" th:fragment="admin-layout(content, pageTitle, activeItem)">
    <!-- ========================================================================= -->
    <!-- 1. POP MART OBSIDIAN BLACK SIDEBAR                                        -->
    <!-- ========================================================================= -->
    <aside class="admin-sidebar" id="adminSidebar">
        <div class="admin-sidebar-header">
            <a th:href="@{/admin}" class="d-flex align-items-center text-decoration-none">
                <img th:src="@{/images/logo-popworld.svg}" alt="POPWORLD" height="34" style="display:inline-block;">
            </a>
            <button class="btn btn-link text-white-50 d-lg-none p-0 fs-4" onclick="toggleAdminSidebar()">
                <i class="bi bi-x-lg"></i>
            </button>
        </div>

        <div class="admin-nav-group">
            <p class="admin-nav-label">Quản Lý Chính</p>
            <a th:href="@{/admin}" class="admin-nav-link" th:classappend="${activeItem == 'dashboard' ? 'active' : ''}">
                <i class="bi bi-grid-1x2"></i>
                <span>Bảng Điều Khiển</span>
            </a>

            <a th:href="@{/admin/orders}" class="admin-nav-link" th:classappend="${activeItem == 'orders' ? 'active' : ''}">
                <i class="bi bi-box-seam"></i>
                <span>Quản Lý Đơn Hàng</span>
            </a>

            <a th:href="@{/admin/products}" class="admin-nav-link" th:classappend="${activeItem == 'products' ? 'active' : ''}">
                <i class="bi bi-collection"></i>
                <span>Kho Hàng Art Toy</span>
            </a>

            <p class="admin-nav-label mt-3">Khách Hàng & Hệ Thống</p>
            <a th:href="@{/admin/customers}" class="admin-nav-link" th:classappend="${activeItem == 'customers' ? 'active' : ''}">
                <i class="bi bi-people"></i>
                <span>Khách Hàng & VIP</span>
            </a>

            <a th:href="@{/}" target="_blank" class="admin-nav-link text-white-50 mt-2">
                <i class="bi bi-shop"></i>
                <span>Xem Cửa Hàng</span>
                <i class="bi bi-arrow-up-right ms-auto fs-6"></i>
            </a>
        </div>

        <div class="admin-sidebar-footer">
            <div class="rounded-circle bg-danger text-white d-flex align-items-center justify-content-center fw-bold" style="width: 38px; height: 38px; font-size: 0.9rem;">
                PW
            </div>
            <div class="overflow-hidden">
                <div class="text-white small fw-bold text-truncate">Quản Trị Viên</div>
                <div class="text-secondary" style="font-size: 0.72rem;">admin@popworld.com</div>
            </div>
        </div>
    </aside>

    <!-- ========================================================================= -->
    <!-- 2. MAIN CONTENT AREA & TOPBAR                                             -->
    <!-- ========================================================================= -->
    <main class="admin-main">
        <header class="admin-topbar">
            <div class="d-flex align-items-center gap-3">
                <button class="btn btn-light d-lg-none rounded-circle p-2" onclick="toggleAdminSidebar()">
                    <i class="bi bi-list fs-5"></i>
                </button>
                <div>
                    <h5 class="mb-0 fw-bold" th:text="${pageTitle}">Trang Quản Trị</h5>
                </div>
            </div>

            <div class="d-flex align-items-center gap-3">
                <a th:href="@{/}" target="_blank" class="btn-store-preview">
                    <i class="bi bi-eye"></i>
                    <span class="d-none d-sm-inline">Xem Cửa Hàng</span>
                </a>

                <div class="d-flex align-items-center gap-2 ps-3 border-start">
                    <div class="rounded-circle bg-dark text-white d-flex align-items-center justify-content-center fw-bold" style="width: 36px; height: 36px; font-size: 0.85rem;">
                        A
                    </div>
                    <div class="d-none d-md-block text-start">
                        <div class="small fw-bold lh-1">Admin PopWorld</div>
                        <span class="badge bg-warning text-dark fw-bold" style="font-size: 0.65rem; border-radius: 4px;">ROLE_ADMIN</span>
                    </div>
                </div>
            </div>
        </header>

        <!-- Flash Alerts -->
        <div class="container-fluid px-4 pt-3" th:if="${successMessage != null or errorMessage != null}">
            <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show rounded-4 shadow-sm border-0 d-flex align-items-center gap-2" role="alert">
                <i class="bi bi-check-circle-fill fs-5 text-success"></i>
                <span th:text="${successMessage}">Thành công!</span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
            <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show rounded-4 shadow-sm border-0 d-flex align-items-center gap-2" role="alert">
                <i class="bi bi-exclamation-triangle-fill fs-5 text-danger"></i>
                <span th:text="${errorMessage}">Đã xảy ra lỗi!</span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
        </div>

        <!-- Injected Body Content -->
        <div class="admin-content">
            <div th:replace="${content}"></div>
        </div>
    </main>
</div>

<!-- Bootstrap 5 JS Bundle -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    function toggleAdminSidebar() {
        const sidebar = document.getElementById('adminSidebar');
        if (sidebar) sidebar.classList.toggle('show');
    }
</script>
</body>
</html>
