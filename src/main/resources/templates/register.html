<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Ký Tài Khoản - PopWorld Art Toy</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/popmart-theme.css}">
    <style>
        /* POP MART Auth Tabs (Sign In / Register) */
        .pop-auth-tabs {
            border-bottom: 2px solid #E0E0E0;
            gap: 28px;
        }
        .pop-auth-tab {
            padding: 12px 2px;
            font-weight: 700;
            font-size: 16px;
            color: #666666;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            position: relative;
            transition: color 0.18s ease;
            border-bottom: 2px solid transparent;
            margin-bottom: -2px;
        }
        .pop-auth-tab:hover {
            color: #000000;
        }
        .pop-auth-tab.active {
            color: #000000 !important;
            border-bottom-color: #D2001E !important;
        }
        .auth-card-popmart {
            background: #FFFFFF;
            border: 1px solid #E0E0E0;
            border-radius: 0px !important;
            box-shadow: none;
        }
        .form-control-pop {
            border-radius: 0px !important;
            border: 1px solid #CCCCCC;
            height: 44px;
            font-size: 14px;
            padding: 10px 14px;
            transition: border-color 0.15s ease, box-shadow 0.15s ease;
        }
        .form-control-pop:focus {
            border-color: #000000 !important;
            box-shadow: none !important;
            outline: none;
        }
    </style>
</head>
<body class="bg-light">

    <!-- Header Fragment -->
    <header th:replace="~{fragments/header :: header}"></header>

    <main class="container my-5">
        <div class="row justify-content-center">
            <div class="col-12 col-md-8 col-lg-6 col-xl-5">

                <!-- Alert Messages -->
                <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show rounded-0 shadow-none mb-4 border-danger" role="alert">
                    <i class="bi bi-exclamation-triangle-fill me-2"></i>
                    <span th:text="${errorMessage}">Đã xảy ra lỗi</span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>

                <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show rounded-0 shadow-none mb-4 border-success" role="alert">
                    <i class="bi bi-check-circle-fill me-2"></i>
                    <span th:text="${successMessage}">Thành công</span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>

                <!-- Registration Card -->
                <div class="auth-card-popmart p-4 p-sm-5">
                    
                    <!-- 2-Tab Switcher (POP MART US SPEC) -->
                    <div class="pop-auth-tabs d-flex align-items-center mb-4">
                        <a th:href="@{/login}" class="pop-auth-tab text-decoration-none">
                            <span>ĐĂNG NHẬP</span>
                        </a>
                        <a th:href="@{/register}" class="pop-auth-tab active text-decoration-none">
                            <span>TẠO TÀI KHOẢN</span>
                        </a>
                    </div>

                    <!-- Title & Subtitle -->
                    <div class="mb-4">
                        <div class="d-inline-flex align-items-center gap-1 text-danger fw-bold small text-uppercase mb-1" style="font-size: 11px; letter-spacing: 0.5px;">
                            <i class="bi bi-gift-fill"></i> TẶNG VOUCHER CHO THÀNH VIÊN MỚI
                        </div>
                        <h1 class="h4 fw-bold text-dark text-uppercase mb-1" style="letter-spacing: 0.5px;">Gia Nhập PopWorld</h1>
                        <p class="text-secondary small mb-0">Khám phá thế giới Blind Box &amp; Art Toy chính hãng cùng cộng đồng collector.</p>
                    </div>

                    <form th:action="@{/register}" th:object="${registerRequest}" method="post" novalidate>
                        
                        <!-- Full Name -->
                        <div class="mb-3">
                            <label for="fullName" class="form-label fw-bold small text-uppercase text-dark mb-1" style="letter-spacing: 0.5px; font-size: 11px;">
                                Họ và tên <span class="text-danger">*</span>
                            </label>
                            <input type="text" th:field="*{fullName}" id="fullName" class="form-control form-control-pop w-100" 
                                   placeholder="Nguyễn Văn A" 
                                   th:classappend="${#fields.hasErrors('fullName')} ? 'is-invalid' : ''">
                            <div th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}" class="invalid-feedback fw-semibold small ms-1"></div>
                        </div>

                        <!-- Email -->
                        <div class="mb-3">
                            <label for="email" class="form-label fw-bold small text-uppercase text-dark mb-1" style="letter-spacing: 0.5px; font-size: 11px;">
                                Địa chỉ Email <span class="text-danger">*</span>
                            </label>
                            <input type="email" th:field="*{email}" id="email" class="form-control form-control-pop w-100" 
                                   placeholder="name@example.com" 
                                   th:classappend="${#fields.hasErrors('email')} ? 'is-invalid' : ''">
                            <div th:if="${#fields.hasErrors('email')}" th:errors="*{email}" class="invalid-feedback fw-semibold small ms-1"></div>
                        </div>

                        <!-- Phone -->
                        <div class="mb-3">
                            <label for="phone" class="form-label fw-bold small text-uppercase text-dark mb-1" style="letter-spacing: 0.5px; font-size: 11px;">
                                Số điện thoại
                            </label>
                            <input type="tel" th:field="*{phone}" id="phone" class="form-control form-control-pop w-100" 
                                   placeholder="0912345678" 
                                   th:classappend="${#fields.hasErrors('phone')} ? 'is-invalid' : ''">
                            <div th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}" class="invalid-feedback fw-semibold small ms-1"></div>
                        </div>

                        <!-- Password -->
                        <div class="mb-3">
                            <label for="password" class="form-label fw-bold small text-uppercase text-dark mb-1" style="letter-spacing: 0.5px; font-size: 11px;">
                                Mật khẩu <span class="text-danger">*</span>
                            </label>
                            <input type="password" th:field="*{password}" id="password" class="form-control form-control-pop w-100" 
                                   placeholder="Tối thiểu 6 ký tự" 
                                   th:classappend="${#fields.hasErrors('password')} ? 'is-invalid' : ''">
                            <div th:if="${#fields.hasErrors('password')}" th:errors="*{password}" class="invalid-feedback fw-semibold small ms-1"></div>
                        </div>

                        <!-- Confirm Password -->
                        <div class="mb-4">
                            <label for="confirmPassword" class="form-label fw-bold small text-uppercase text-dark mb-1" style="letter-spacing: 0.5px; font-size: 11px;">
                                Xác nhận mật khẩu <span class="text-danger">*</span>
                            </label>
                            <input type="password" th:field="*{confirmPassword}" id="confirmPassword" class="form-control form-control-pop w-100" 
                                   placeholder="Nhập lại mật khẩu" 
                                   th:classappend="${#fields.hasErrors('confirmPassword')} ? 'is-invalid' : ''">
                            <div th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}" class="invalid-feedback fw-semibold small ms-1"></div>
                        </div>

                        <!-- Submit Button -->
                        <button type="submit" class="btn btn-pop-submit w-100 text-uppercase fw-bold shadow-none" 
                                style="min-height: 48px; font-size: 14px; letter-spacing: 1px; border-radius: 0px;">
                            TẠO TÀI KHOẢN MỚI
                        </button>

                        <div class="text-center mt-3">
                            <span class="text-secondary small">Bạn đã có tài khoản POP WORLD? </span>
                            <a th:href="@{/login}" class="fw-bold text-dark text-decoration-underline small">Đăng nhập ngay</a>
                        </div>
                    </form>
                </div>

            </div>
        </div>
    </main>

    <!-- Footer Fragment -->
    <footer th:replace="~{fragments/footer :: footer}"></footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
