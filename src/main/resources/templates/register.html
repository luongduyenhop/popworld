<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Ký Tài Khoản - PopWorld Art Toy</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/popmart-theme.css}">
</head>
<body class="bg-light">

    <!-- Header Fragment -->
    <header th:replace="~{fragments/header :: header}"></header>

    <main class="container my-5">
        <div class="row justify-content-center">
            <div class="col-12 col-md-8 col-lg-6 col-xl-5">

                <!-- Alert Messages -->
                <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show rounded-4 shadow-sm mb-4" role="alert">
                    <i class="bi bi-exclamation-triangle-fill me-2"></i>
                    <span th:text="${errorMessage}">Đã xảy ra lỗi</span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>

                <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show rounded-4 shadow-sm mb-4" role="alert">
                    <i class="bi bi-check-circle-fill me-2"></i>
                    <span th:text="${successMessage}">Thành công</span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>

                <!-- Registration Card -->
                <div class="auth-card p-4 p-sm-5">
                    <div class="text-center mb-4">
                        <span class="badge-pop-welcome text-uppercase fw-bold mb-2 d-inline-block">
                            <i class="bi bi-gift-fill me-1"></i> Tặng Voucher Cho Thành Viên Mới
                        </span>
                        <h2 class="fw-bolder mt-2 mb-1">Tạo Tài Khoản</h2>
                        <p class="text-muted small">Khám phá thế giới Blind Box & Art Toy chính hãng tại PopWorld</p>
                    </div>

                    <form th:action="@{/register}" th:object="${registerRequest}" method="post" novalidate>
                        
                        <!-- Full Name -->
                        <div class="mb-3">
                            <label for="fullName" class="form-label fw-bold small text-secondary">Họ và tên <span class="text-danger">*</span></label>
                            <input type="text" th:field="*{fullName}" id="fullName" class="form-control form-control-pop" 
                                   placeholder="Nguyễn Văn A" 
                                   th:classappend="${#fields.hasErrors('fullName')} ? 'is-invalid' : ''">
                            <div th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}" class="invalid-feedback fw-semibold small ms-1"></div>
                        </div>

                        <!-- Email -->
                        <div class="mb-3">
                            <label for="email" class="form-label fw-bold small text-secondary">Địa chỉ Email <span class="text-danger">*</span></label>
                            <input type="email" th:field="*{email}" id="email" class="form-control form-control-pop" 
                                   placeholder="name@example.com" 
                                   th:classappend="${#fields.hasErrors('email')} ? 'is-invalid' : ''">
                            <div th:if="${#fields.hasErrors('email')}" th:errors="*{email}" class="invalid-feedback fw-semibold small ms-1"></div>
                        </div>

                        <!-- Phone -->
                        <div class="mb-3">
                            <label for="phone" class="form-label fw-bold small text-secondary">Số điện thoại</label>
                            <input type="tel" th:field="*{phone}" id="phone" class="form-control form-control-pop" 
                                   placeholder="0912345678" 
                                   th:classappend="${#fields.hasErrors('phone')} ? 'is-invalid' : ''">
                            <div th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}" class="invalid-feedback fw-semibold small ms-1"></div>
                        </div>

                        <!-- Password -->
                        <div class="mb-3">
                            <label for="password" class="form-label fw-bold small text-secondary">Mật khẩu <span class="text-danger">*</span></label>
                            <input type="password" th:field="*{password}" id="password" class="form-control form-control-pop" 
                                   placeholder="Tối thiểu 6 ký tự" 
                                   th:classappend="${#fields.hasErrors('password')} ? 'is-invalid' : ''">
                            <div th:if="${#fields.hasErrors('password')}" th:errors="*{password}" class="invalid-feedback fw-semibold small ms-1"></div>
                        </div>

                        <!-- Confirm Password -->
                        <div class="mb-4">
                            <label for="confirmPassword" class="form-label fw-bold small text-secondary">Xác nhận mật khẩu <span class="text-danger">*</span></label>
                            <input type="password" th:field="*{confirmPassword}" id="confirmPassword" class="form-control form-control-pop" 
                                   placeholder="Nhập lại mật khẩu" 
                                   th:classappend="${#fields.hasErrors('confirmPassword')} ? 'is-invalid' : ''">
                            <div th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}" class="invalid-feedback fw-semibold small ms-1"></div>
                        </div>

                        <!-- Submit Button -->
                        <button type="submit" class="btn btn-pop-submit w-100 text-uppercase mb-3 shadow-sm">
                            <i class="bi bi-person-plus-fill me-2"></i> Đăng Ký Tài Khoản
                        </button>

                        <div class="text-center mt-3">
                            <span class="text-muted small">Bạn đã có tài khoản? </span>
                            <a th:href="@{/login}" class="fw-bold text-danger text-decoration-none small">Đăng nhập ngay</a>
                        </div>
                    </form>
                </div>

            </div>
        </div>
    </main>

    <!-- Footer Fragment -->
    <footer th:replace="~{fragments/footer :: footer}"></footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
