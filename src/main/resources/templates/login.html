<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Nhập - PopWorld Art Toy</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/popmart-theme.css}">
</head>
<body class="bg-light">

    <!-- Header Fragment -->
    <header th:replace="~{fragments/header :: header}"></header>

    <main class="container my-5">
        <div class="row justify-content-center">
            <div class="col-12 col-md-8 col-lg-6 col-xl-5">

                <!-- Alert Messages -->
                <div th:if="${param.error}" class="alert alert-danger alert-dismissible fade show rounded-4 shadow-sm mb-4" role="alert">
                    <i class="bi bi-exclamation-triangle-fill me-2"></i>
                    <span>Email hoặc mật khẩu không chính xác, vui lòng thử lại!</span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>

                <div th:if="${param.logout}" class="alert alert-info alert-dismissible fade show rounded-4 shadow-sm mb-4" role="alert">
                    <i class="bi bi-info-circle-fill me-2"></i>
                    <span>Bạn đã đăng xuất tài khoản thành công!</span>
                    <button type="button" data-bs-dismiss="alert" class="btn-close"></button>
                </div>

                <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show rounded-4 shadow-sm mb-4" role="alert">
                    <i class="bi bi-check-circle-fill me-2"></i>
                    <span th:text="${successMessage}">Đăng ký thành công</span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>

                <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show rounded-4 shadow-sm mb-4" role="alert">
                    <i class="bi bi-exclamation-triangle-fill me-2"></i>
                    <span th:text="${errorMessage}">Đã xảy ra lỗi</span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>

                <!-- Login Card -->
                <div class="auth-card p-4 p-sm-5">
                    <div class="text-center mb-4">
                        <h2 class="fw-bolder mt-2 mb-1">Đăng Nhập</h2>
                        <p class="text-muted small">Chào mừng bạn quay trở lại với PopWorld Art Toy</p>
                    </div>

                    <form th:action="@{/login}" method="post">
                        <!-- Email -->
                        <div class="mb-3">
                            <label for="username" class="form-label fw-bold small text-secondary">Email</label>
                            <input type="email" name="username" id="username" class="form-control form-control-pop" 
                                   placeholder="name@example.com" required>
                        </div>

                        <!-- Password -->
                        <div class="mb-4">
                            <label for="password" class="form-label fw-bold small text-secondary">Mật khẩu</label>
                            <input type="password" name="password" id="password" class="form-control form-control-pop" 
                                   placeholder="Nhập mật khẩu" required>
                        </div>

                        <!-- Submit Button -->
                        <button type="submit" class="btn btn-pop-submit w-100 text-uppercase mb-3 shadow-sm">
                            <i class="bi bi-box-arrow-in-right me-2"></i> Đăng Nhập
                        </button>

                        <div class="text-center mt-3">
                            <span class="text-muted small">Chưa có tài khoản? </span>
                            <a th:href="@{/register}" class="fw-bold text-danger text-decoration-none small">Đăng ký thành viên ngay</a>
                        </div>
                    </form>
                </div>

            </div>
        </div>
    </main>

    <!-- Footer Fragment -->
    <footer th:replace="~{fragments/footer :: footer}"></footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
