<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>403 - Truy Cập Bị Từ Chối | PopWorld Art Toy</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/popmart-theme.css}">
    <style>
        .error-card {
            border: 1px solid rgba(0, 0, 0, 0.08);
            border-radius: 28px;
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.06);
            background: #ffffff;
        }
        .error-code {
            font-size: 5rem;
            font-weight: 900;
            letter-spacing: -2px;
            background: linear-gradient(135deg, #FF1824, #FF7B00);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            line-height: 1;
        }
        .btn-pop-primary {
            background-color: #FF1824;
            color: #ffffff;
            font-weight: 700;
            border-radius: 9999px;
            padding: 12px 28px;
            border: none;
            transition: all 0.25s ease;
        }
        .btn-pop-primary:hover {
            background-color: #D40010;
            color: #ffffff;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(255, 24, 36, 0.35);
        }
        .btn-pop-outline {
            border: 2px solid #E2E8F0;
            border-radius: 9999px;
            padding: 12px 28px;
            font-weight: 700;
            color: #111113;
            background: transparent;
            transition: all 0.2s ease;
        }
        .btn-pop-outline:hover {
            border-color: #111113;
            background: #111113;
            color: #ffffff;
        }
    </style>
</head>
<body class="bg-light">

    <!-- Header Fragment -->
    <header th:replace="~{fragments/header :: header}"></header>

    <main class="container my-5 py-4">
        <div class="row justify-content-center">
            <div class="col-12 col-md-8 col-lg-6 text-center">
                
                <div class="error-card p-5">
                    <div class="mb-3">
                        <span class="error-code">403</span>
                    </div>

                    <div class="mb-4">
                        <i class="bi bi-shield-lock-fill text-danger fs-1"></i>
                        <h2 class="fw-bolder mt-3 mb-2">Truy Cập Bị Từ Chối</h2>
                        <p class="text-secondary mb-0">
                            Rất tiếc! Bạn không có quyền quản trị viên (<strong>ROLE_ADMIN</strong>) để truy cập vào khu vực này.
                        </p>
                    </div>

                    <div class="p-3 bg-light rounded-4 mb-4 text-start small">
                        <div class="d-flex align-items-center mb-1">
                            <i class="bi bi-person-circle me-2 text-muted"></i>
                            <span class="text-muted">Tài khoản hiện tại: </span>
                            <span class="fw-bold ms-1" sec:authentication="name">User</span>
                        </div>
                        <div class="d-flex align-items-center">
                            <i class="bi bi-info-circle-fill me-2 text-warning"></i>
                            <span class="text-muted">Nếu bạn là quản trị viên, vui lòng đăng xuất và đăng nhập lại bằng tài khoản được cấp quyền.</span>
                        </div>
                    </div>

                    <div class="d-flex flex-column flex-sm-row justify-content-center gap-3">
                        <a th:href="@{/}" class="btn btn-pop-primary text-uppercase">
                            <i class="bi bi-house-door-fill me-1"></i> Về Trang Chủ
                        </a>
                        <form th:action="@{/logout}" method="post" class="m-0 p-0 d-inline">
                            <button type="submit" class="btn btn-pop-outline text-uppercase w-100">
                                <i class="bi bi-box-arrow-right me-1"></i> Đổi Tài Khoản
                            </button>
                        </form>
                    </div>
                </div>

            </div>
        </div>
    </main>

    <!-- Footer Fragment -->
    <footer th:replace="~{fragments/footer :: footer}"></footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
