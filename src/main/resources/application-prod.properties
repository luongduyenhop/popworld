# ==============================================================================
# POPWORLD PLATFORM - PRODUCTION PROFILE CONFIGURATION (application-prod.properties)
# Kích hoạt khi chạy với: -Dspring.profiles.active=prod hoặc SPRING_PROFILES_ACTIVE=prod
# ==============================================================================

# 1. JPA & Hibernate Production Tuning
# Khuyến nghị 'validate' hoặc 'none' sau khi schema đã ổn định; mặc định an toàn là 'update' có kiểm soát
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# 2. Bật Cache Giao Diện Thymeleaf (Tăng tốc tải trang 5-10x)
spring.thymeleaf.cache=true

# 3. Cookie & Phiên Bảo Mật Toàn Phần (Bắt buộc HTTPS)
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# 4. Che Giấu Lỗi Hệ Thống Tuyệt Đối
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-exception=false

# 5. Tuyệt đối không nạp dữ liệu demo trên Production
app.init-demo-data=false

# 6. Logging Level Production (Giảm ghi disk I/O, chỉ log cảnh báo và lỗi)
logging.level.root=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate=WARN
logging.level.com.manguonmo.popworld=INFO
