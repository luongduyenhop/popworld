spring.application.name=popworld
server.port=${PORT:8080}

# Cấu hình kết nối MySQL (hỗ trợ environment variable overrides cho production)
spring.datasource.url=${DB_URL:jdbc:mysql://127.0.0.1:3306/popworld_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh&characterEncoding=UTF-8}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:admin123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Cấu hình JPA / Hibernate
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${HIBERNATE_FORMAT_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Cấu hình Thymeleaf
spring.thymeleaf.cache=${THYMELEAF_CACHE:false}
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# Cấu hình SePay Webhook & Payment Gateway (bảo mật production secrets)
sepay.webhook.api-key=${SEPAY_WEBHOOK_API_KEY:popworld_secret_key_2026}
sepay.bank-code=${SEPAY_BANK_CODE:MBBank}
sepay.account-number=${SEPAY_ACCOUNT_NUMBER:0355416208}
sepay.account-name=${SEPAY_ACCOUNT_NAME:POPWORLD OFFICIAL STORE}

# Cấu hình khởi tạo dữ liệu mẫu (Mặc định OFF, chỉ bật khi explicit: APP_INIT_DEMO_DATA=true)
app.init-demo-data=${APP_INIT_DEMO_DATA:false}

# Cấu hình Session & Cookie Security
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}

# Ngăn chặn rò rỉ thông tin lỗi và stacktrace trên toàn hệ thống
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-exception=false

# Buffer size cho Tomcat tránh commit sớm khi render template lớn
server.tomcat.response-buffer-size=65536

# Cấu hình Cloudinary Media Storage (hỗ trợ environment variables)
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}
cloudinary.folder=${CLOUDINARY_FOLDER:popworld/products}

# Giới hạn dung lượng tải lên file ảnh
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=20MB